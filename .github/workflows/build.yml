name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'patente_app.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unzip project
        run: unzip -q patente_app.zip -d app

      - name: Build APK
        working-directory: app
        run: |
          flutter create --project-name patente_app --platforms=android .
          rm -rf test
          mkdir -p assets/signs && touch assets/signs/.gitkeep
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: patente-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
